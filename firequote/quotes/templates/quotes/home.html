{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FireQuote</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">

    <style>
        .main-card {
            border: 2px solid #e30613;
            border-radius: 12px;
            padding: 40px;
        }
        .home-btn {
            background-color: #e30613;
            border-color: #e30613;
            font-size: 1.4rem;
            padding: 20px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .home-btn:hover {
            background-color: #b0050f;
            border-color: #b0050f;
        }
    </style>
</head>
<body class="container py-4">

<div class="header-bar d-flex justify-content-between align-items-end">
    <img src="{% static 'images/logo.png' %}" class="logo">
    <h1 class="text-end">Panel Principal</h1>
</div>

<div class="main-card shadow">
    <a href="{% url 'client_list' %}" class="btn btn-primary home-btn w-100">Buscar Cliente</a>
    <a href="{% url 'quote_list' %}" class="btn btn-primary home-btn w-100">Buscar Cotización</a>
    <a href="{% url 'quote_form' %}" class="btn btn-primary home-btn w-100">Generar Cotización</a>
</div>

</body>
</html>
