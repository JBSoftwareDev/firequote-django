{% load static %}
<!DOCTYPE html>
<html lang="es">
<link rel="icon" type="image/x-icon" href="{% static 'images/icon.ico' %}">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">

    <style>
        .btn-danger { background-color: #b0050f; border-color: #b0050f; }
        .object-row { display: flex; align-items: center; gap: 12px; }
        .object-link { flex: 1; text-decoration: none; color: inherit; }
        .list-actions {
            padding-left: 16px;
        }

        .list-actions .form-check {
            margin-bottom: 0;
        }
    </style>
</head>
<body class="container py-4">

<div class="header-bar">
    <img src="{% static 'images/logo.png' %}" class="logo">

    <h2 class="header-title">
        Directorio de Clientes
    </h2>
</div>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
{% endif %}

<form method="GET" class="card p-4 mb-4">
    <div class="d-flex">
        <input type="text" name="q" value="{{ query }}" class="form-control me-2" placeholder="Buscar por nombre o empresa">
        <button class="btn btn-primary" type="submit">Buscar</button>
    </div>
</form>

<form method="POST" onsubmit="return confirm('¿Seguro que deseas eliminar los clientes seleccionados? Esta acción también eliminará sus cotizaciones.');">
    {% csrf_token %}

    <div class="d-flex justify-content-between align-items-center mb-3 list-actions">

        <div class="form-check">
            <input
                type="checkbox"
                id="select_all_clients"
                class="form-check-input">

            <label
                for="select_all_clients"
                class="form-check-label">
                Seleccionar todos
            </label>
        </div>

        <button type="submit" class="btn btn-danger">
            Eliminar seleccionados
        </button>

    </div>

    <div class="list-group">
        {% for client in clients %}
            <div class="list-group-item object-row">
                <input type="checkbox" name="selected_clients" value="{{ client.id }}" class="form-check-input">

                <a href="{% url 'client_detail' client.id %}" class="object-link">
                    <strong>{{ client.full_name }}</strong><br>
                    {{ client.company }}
                </a>
            </div>
        {% empty %}
            <div class="alert alert-info">No se encontraron clientes.</div>
        {% endfor %}
    </div>
</form>

<script>
document
.getElementById("select_all_clients")
.addEventListener("change", function(){

    document
    .querySelectorAll('input[name="selected_clients"]')
    .forEach(function(checkbox){

        checkbox.checked =
        document
        .getElementById("select_all_clients")
        .checked;

    });

});
</script>

<div class="page-bottom-actions">
    <a href="{% url 'home' %}" class="btn btn-home">
        Volver al inicio
    </a>
</div>

</body>
</html>
