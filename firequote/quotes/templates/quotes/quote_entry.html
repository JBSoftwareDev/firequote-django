<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar Cotización</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">

    <style>
        input, button { padding: 8px; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Buscar cotización</h1>
    <form method="POST">
        {% csrf_token %}
        <label>ID de la cotización:</label><br>
        <input type="number" name="quote_id" required><br>
        <button type="submit">Abrir detalles</button>
    </form>
</body>
</html>
